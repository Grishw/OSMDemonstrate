<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>GeoApp</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="controls">
    <button id="createConnectionBtn">Создать связь</button>
    <span id="status"></span>
    <select id="areaSelect">
      <!-- Опции будут добавлены динамически -->
    </select>
  </div>
  
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([55.75, 37.61], 10);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
    }).addTo(map);

    let layerGroup = L.geoJSON().addTo(map);

    function loadComponents() {
      fetch('/api/components')
        .then(r => r.json())
        .then(data => {
          data.forEach(component => {
            const nodes = component.nodes;
            const firstNode = nodes[0];
            const lastNode = nodes[nodes.length - 1];

            const marker1 = L.marker(firstNode).addTo(map);
            const marker2 = L.marker(lastNode).addTo(map);

            marker1.bindPopup(`Node ${firstNode}`).openPopup();
            marker2.bindPopup(`Node ${lastNode}`).openPopup();

            // Добавляем линию между узлами с уникальным цветом для каждого компонента
            const color = getRandomColor();
            L.polyline([firstNode, lastNode], { color: color }).addTo(map);
          });
        });
    }

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    document.getElementById('createConnectionBtn').addEventListener("click", createConnection);

    function createConnection() {
      const node1 = prompt("Введите ID первого узла:");
      const node2 = prompt("Введите ID второго узла:");

      if (node1 && node2) {
        fetch('/api/create_connection', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ node1, node2 })
        })
        .then(r => r.json())
        .then(data => {
          alert(data.message);
        });
      }
    }

    // Добавляем выбор центральной области
    document.getElementById('areaSelect').addEventListener("change", function() {
      const selectedArea = this.value;
      // Обновляем карту на основе выбранной области
      updateMap(selectedArea);
    });

    function updateMap(selectedArea) {
      // Очистка существующих слоев
      layerGroup.clearLayers();

      // Получение данных о компонентах для выбранной области
      fetch(`/api/components?area=${selectedArea}`)
        .then(r => r.json())
        .then(data => {
          data.forEach(component => {
            const nodes = component.nodes;
            const firstNode = nodes[0];
            const lastNode = nodes[nodes.length - 1];

            const marker1 = L.marker(firstNode).addTo(map);
            const marker2 = L.marker(lastNode).addTo(map);

            marker1.bindPopup(`Node ${firstNode}`).openPopup();
            marker2.bindPopup(`Node ${lastNode}`).openPopup();

            // Добавляем линию между узлами с уникальным цветом для каждого компонента
            const color = getRandomColor();
            L.polyline([firstNode, lastNode], { color: color }).addTo(map);
          });
        });
    }

    // Инициализация выбора области
    fetch('/api/areas')
      .then(r => r.json())
      .then(data => {
        const select = document.getElementById('areaSelect');
        data.forEach(area => {
          const option = document.createElement('option');
          option.value = area.id;
          option.text = `Area ${area.id}`;
          select.add(option);
        });
      });

    loadComponents();
  </script>
</body>
</html>
