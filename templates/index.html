<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Гео-навигатор</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div id="controls">
    <h3>Построение маршрута</h3>
    
    <div class="toggle-group">
      <label class="toggle">
        <input type="checkbox" id="showRoads">
        <span class="toggle-slider"></span>
        Показывать дороги
      </label>
    </div>

    <div class="input-group">
      <label>Начало:</label>
      <input id="start" placeholder="широта, долгота" />
    </div>
    <div class="input-group">
      <label>Конец:</label>
      <input id="end" placeholder="широта, долгота" />
    </div>

    <div class="input-group">
      <label>Алгоритм:</label>
      <select id="algorithm">
        <option value="dijkstra">Дейкстра (точный)</option>
        <option value="astar">A* (быстрый)</option>
      </select>
    </div>

    <button id="routeBtn">Построить маршрут</button>
    <!-- Кнопка сравнения добавится автоматически через JavaScript -->
    <div id="status"></div>
  </div>
  
  <div id="routeInfo">
    <div class="info-header">
      <strong>Информация о маршруте</strong>
      <button id="closeInfo">×</button>
    </div>
    <div id="routeSummary"></div>
  </div>
  
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='js/routing.js') }}"></script>
  <script src="{{ url_for('static', filename='js/comparison.js') }}"></script>
</body>
</html>
