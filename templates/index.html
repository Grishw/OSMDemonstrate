<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Demo маршрутизации (CH / CRP)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { height: 100%; margin: 0; }
    #map { width: 100%; height: 90vh; } /* карта занимает ~90% высоты */
    #controls {
      padding: 6px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255,255,255,0.95);
    }
    input[type=text]{ width: 220px; padding:6px; }
    select{ padding:6px; }
    button{ padding:6px 10px; }
  </style>
</head>
<body>
  <div id="controls">
    Start: <input id="start" placeholder="lat, lon" />
    End: <input id="end" placeholder="lat, lon" />
    Algorithm:
    <select id="algo">
      <option value="ch">Contraction Hierarchies (CH)</option>
      <option value="crp">Customizable RP (CRP)</option>
    </select>
    <button id="routeBtn">Построить маршрут</button>
    <span id="status"></span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([55.75, 37.6], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);

    let startMarker = null;
    let endMarker = null;
    let routeLayer = null;

    // --- Загружаем регионы и центрируем карту ---
    fetch("/regions").then(r => r.json()).then(data => {
        const regionLayer = L.geoJSON(data, {
            style: {color: "red", weight: 2, fill: false}
        }).addTo(map);

        if (data.features.length > 0) {
            // используем первый регион для начального позиционирования
            const bounds = regionLayer.getBounds();
            map.fitBounds(bounds, {padding: [20, 20]});
        }
    });

    fetch("/shortcuts").then(r => r.json()).then(data => {
      L.geoJSON(data, {
          style: feature => ({
              color: feature.properties.algo === "ch" ? "blue" : "green",
              weight: 2,
              opacity: 0.5
          }),
          interactive: false // линии не кликабельны
      }).addTo(map);
    }); 

    function setField(id, latlng) {
      document.getElementById(id).value = latlng.lat.toFixed(6)+', '+latlng.lng.toFixed(6);
    }

    map.on('click', function(e){
      // левый клик — если нет start, ставим start; если есть start и нет end — ставим end; если есть оба — заменяем nearest
      if (!startMarker) {
        startMarker = L.marker(e.latlng, {draggable:true}).addTo(map).bindPopup('Start').openPopup();
        setField('start', e.latlng);
        startMarker.on('dragend', ev=> setField('start', ev.target.getLatLng()));
      } else if (!endMarker) {
        endMarker = L.marker(e.latlng, {draggable:true}).addTo(map).bindPopup('End').openPopup();
        setField('end', e.latlng);
        endMarker.on('dragend', ev=> setField('end', ev.target.getLatLng()));
      } else {
        // если оба есть — по клику определим ближайший и заменим
        const d1 = map.distance(e.latlng, startMarker.getLatLng());
        const d2 = map.distance(e.latlng, endMarker.getLatLng());
        if (d1 < d2) {
          startMarker.setLatLng(e.latlng);
          setField('start', e.latlng);
        } else {
          endMarker.setLatLng(e.latlng);
          setField('end', e.latlng);
        }
      }
    });

    document.getElementById('routeBtn').onclick = async function(){
      const s = document.getElementById('start').value.trim();
      const t = document.getElementById('end').value.trim();
      const algo = document.getElementById('algo').value;
      if (!s || !t){ alert('Укажите start и end'); return; }
      const parse = (str) => {
        const parts = str.split(',').map(x=>parseFloat(x.trim()));
        return [parts[0], parts[1]];
      }
      const start = parse(s);
      const end = parse(t);
      document.getElementById('status').innerText = '...запрос к серверу';
      try {
        const resp = await fetch('/route', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ start: start, end: end, algo: algo })
        });
        if (!resp.ok) {
          const err = await resp.json();
          alert('Ошибка: '+(err.error||resp.statusText));
          document.getElementById('status').innerText = '';
          return;
        }
        const geo = await resp.json();
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(geo, {
          style: { color: algo === 'ch' ? 'blue' : 'green', weight: 5 }
        }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding:[20,20]});
        document.getElementById('status').innerText = 'Маршрут построен ('+algo+')';
      } catch (e) {
        alert('Ошибка сети: '+e);
        document.getElementById('status').innerText = '';
      }
    }
  </script>
</body>
</html>
