<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>GeoApp</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="controls">
    <select id="tagSelect">
      <option value="">Все линии</option>
      <option value="highway">Дороги (highway)</option>
      <option value="waterway">Реки/каналы (waterway)</option>
      <option value="railway">Ж/д (railway)</option>
      <option value="building">Здания (building)</option>
    </select>
    Start: <input id="start" placeholder="lat, lon" />
    End: <input id="end" placeholder="lat, lon" />
    <button id="routeBtn">Построить маршрут</button>
    <span id="status"></span>
  </div>
  
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([55.75, 37.61], 10);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
    }).addTo(map);

    let startMarker = null;
    let endMarker = null; 

    let layerGroup = L.geoJSON().addTo(map);
    function setField(id, latlng) {
      document.getElementById(id).value = latlng.lat.toFixed(6)+', '+latlng.lng.toFixed(6);
    }

    map.on('click', function(e){
      // левый клик — если нет start, ставим start; если есть start и нет end — ставим end; если есть оба — заменяем nearest
      if (!startMarker) {
        startMarker = L.marker(e.latlng, {draggable:true}).addTo(map).bindPopup('Start').openPopup();
        setField('start', e.latlng);
        startMarker.on('dragend', ev=> setField('start', ev.target.getLatLng()));
      } else if (!endMarker) {
        endMarker = L.marker(e.latlng, {draggable:true}).addTo(map).bindPopup('End').openPopup();
        setField('end', e.latlng);
        endMarker.on('dragend', ev=> setField('end', ev.target.getLatLng()));
      } else {
        // если оба есть — по клику определим ближайший и заменим
        const d1 = map.distance(e.latlng, startMarker.getLatLng());
        const d2 = map.distance(e.latlng, endMarker.getLatLng());
        if (d1 < d2) {
          startMarker.setLatLng(e.latlng);
          setField('start', e.latlng);
        } else {
          endMarker.setLatLng(e.latlng);
          setField('end', e.latlng);
        }
      }
    });

    function requestRoute() {
      const s = document.getElementById('start').value.trim();
      const t = document.getElementById('end').value.trim();

      const parse = (str) => {
        const parts = str.split(',').map(x=>parseFloat(x.trim()));
        return [parts[0], parts[1]];
      }
      const start = parse(s);
      const end = parse(t);

        const body = {
            start: { start },
            end: { end }
        };

        fetch('/api/route', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        })
            .then(res => res.json())
            .then(data => {
                 if (data.status === 'ok' && data.geometry) {
                    var geojson = JSON.parse(data.geometry);
                    if (routeLayer) { map.removeLayer(routeLayer); }
                    routeLayer = L.geoJSON(geojson, {color: 'red', weight: 4}).addTo(map);
                    map.fitBounds(routeLayer.getBounds());
                } else {
                    alert(data.message || "Маршрут не найден");
                }
            })
            .catch(err => console.error(err));
    }
    document.getElementById('routeBtn').addEventListener("click", requestRoute);;

    function loadWays() {
      layerGroup.clearLayers();

      const bounds = map.getBounds();
      var zoom = map.getZoom();
      const bbox = [
        bounds.getWest(),
        bounds.getSouth(),
        bounds.getEast(),
        bounds.getNorth()
      ].join(",");

      const tag = document.getElementById("tagSelect").value;
      let url = `/api/ways?bbox=${bbox}&zoom=${zoom}`;
      if (tag) {
        url += `&tag=${tag}`;
      }

      fetch(url)
        .then(r => r.json())
        .then(data => {
          layerGroup.addData(data);
        });
    }

    map.on("moveend", loadWays);
    document.getElementById("tagSelect").addEventListener("change", loadWays);

    loadWays();
  </script>
</body>
</html>
